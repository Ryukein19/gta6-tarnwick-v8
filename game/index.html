<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tarnwick — Come Home</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #17120e;
        color: #f7f2e8;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #status {
        position: fixed;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        z-index: 10;
        padding: 6px 14px;
        border: 1px solid #3a2c22;
        background: rgba(23, 18, 14, 0.9);
        color: #f7f2e8;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <canvas id="game" tabindex="0"></canvas>
    </main>
    <p id="status" role="status" aria-live="polite">Loading Tarnwick…</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
