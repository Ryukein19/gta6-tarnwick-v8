<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarnwick — Come Home</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center center; pointer-events: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5efe4; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .panel { background: rgba(16, 10, 18, 0.72); border: 1px solid rgba(255, 210, 140, 0.35); border-radius: 8px; box-shadow: 0 2px 14px rgba(0,0,0,0.45); }
  .gold { color: #f2c94c; }
  .white { color: #f5efe4; }
  .muted { color: #cbb89a; }
  .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.18); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; background: #f2c94c; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 4px; background: rgba(242, 201, 76, 0.18); border: 1px solid rgba(242, 201, 76, 0.5); color: #f2c94c; font-weight: 700; }
  .key { display: inline-block; min-width: 20px; text-align: center; padding: 1px 5px; border-radius: 4px; background: #2a2230; border: 1px solid #8b93a3; color: #fff; font-weight: 700; }
  .locked { color: #ff5a4e; }
  .ready { color: #7ee787; }
  .cool { color: #f2c94c; }
</style>
</head>
<body>
<canvas id="game" aria-label="Tarnwick: drive the Falcon GT through the harbour chase, lose the helicopter, reach the safehouse"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
